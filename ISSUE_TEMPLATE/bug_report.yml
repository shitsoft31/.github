name: Bug Report
description: Report a bug or unexpected behavior.
title: "[Bug]: "
labels:

* bug
  body:

* type: markdown
  attributes:
  value: |
  Thank you for taking the time to report a bug.

* type: input
  id: project
  attributes:
  label: Project
  description: Which project is affected?
  placeholder: Example: awesome-api
  validations:
  required: true

* type: textarea
  id: description
  attributes:
  label: Bug Description
  description: Clearly describe the problem.
  placeholder: What happened?
  validations:
  required: true

* type: textarea
  id: reproduce
  attributes:
  label: Steps to Reproduce
  placeholder: |
  1. Go to...
  2. Click...
  3. See error...
  validations:
  required: true

* type: textarea
  id: expected
  attributes:
  label: Expected Behavior
  placeholder: What did you expect to happen?
  validations:
  required: true

* type: textarea
  id: environment
  attributes:
  label: Environment
  description: OS, compiler, browser, runtime, version, etc.
  placeholder: |
  OS:
  Version:
  Compiler:
  Runtime:

* type: textarea
  id: logs
  attributes:
  label: Logs / Screenshots
  description: Paste logs or attach screenshots if available.
  render: shell
